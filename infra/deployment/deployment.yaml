# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-manager-service-account
  namespace: ${NAMESPACE}
---
# Cluster Role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-manager
rules:
- apiGroups: ["batch", ""]
  resources: ["jobs", "cronjobs", "secrets"]
  verbs: ["create", "delete", "update", "get", "list", "watch"]
---
# Cluster Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-manager-binding
subjects:
- kind: ServiceAccount
  name: job-manager-service-account
  namespace: ${NAMESPACE}
roleRef:
  kind: ClusterRole
  name: job-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browseterm-server
  namespace: ${NAMESPACE}
  labels:
    app: browseterm-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browseterm-server
  template:
    metadata:
      labels:
        app: browseterm-server
    spec:
      serviceAccountName: job-manager-service-account
      containers:
      - name: browseterm-server
        image: ${REPO_NAME}/browseterm-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9999
        env:
        - name: CONTAINER_MAKER_HOST
          value: "${CONTAINER_MAKER_HOST}"
        - name: CONTAINER_MAKER_PORT
          value: "${CONTAINER_MAKER_PORT}"
        - name: CONTAINER_MAKER_CERTS_SECRET_NAME
          value: "${CONTAINER_MAKER_CERTS_SECRET_NAME}"
        - name: NAMESPACE
          value: "${NAMESPACE}"
        - name: CERT_MANAGER_CRON_JOB_NAME
          value: ${CERT_MANAGER_CRON_JOB_NAME}
        - name: CERT_MANAGER_CRON_JOB_NAMESPACE
          value: ${NAMESPACE}
        - name: AUTH_REDIRECT_BASE_URI
          value: ${AUTH_REDIRECT_BASE_URI}
        - name: GOOGLE_CLIENT_ID
          value: ${GOOGLE_CLIENT_ID}
        - name: GOOGLE_CLIENT_SECRET
          value: ${GOOGLE_CLIENT_SECRET}
        - name: GITHUB_CLIENT_ID
          value: ${GITHUB_CLIENT_ID}
        - name: GITHUB_CLIENT_SECRET
          value: ${GITHUB_CLIENT_SECRET}
        - name: REDIS_HOST
          value: "${REDIS_HOST}"
        - name: REDIS_PORT
          value: "${REDIS_PORT}"
        - name: REDIS_PASSWORD
          value: "${REDIS_PASSWORD}"
        - name: REDIS_USERNAME
          value: "${REDIS_USERNAME}"
        - name: REDIS_DB
          value: "${REDIS_DB}"
        - name: POSTGRES_HOST
          value: "${POSTGRES_HOST}"
        - name: POSTGRES_PORT
          value: "${POSTGRES_PORT}"
        - name: POSTGRES_USER
          value: "${POSTGRES_USER}"
        - name: POSTGRES_PASSWORD
          value: "${POSTGRES_PASSWORD}"
        - name: POSTGRES_DB
          value: "${POSTGRES_DB}"
