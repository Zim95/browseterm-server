# Cloud browseterm-server.
#
# As of P06 this is the entire repository's Deployment/Service - there is no other server left
# in this repo to confuse it with. The Local browser-facing server now lives in the separate
# `browseterm-server-local` repository/Deployment entirely. Runs `app:app` (renamed from
# `cloud_app:app` in P06 - see README.md).
#
# PostgreSQL/Redis + OAuth configuration is wired here (P07 made Cloud the sole OAuth authority -
# see p07.md); still no ContainerMaker, Socket-SSH, MinIO, or payment-gateway settings -- this
# Cloud process does not use them and must not depend on them to start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browseterm-server-cloud
  namespace: ${NAMESPACE}
  labels:
    app: browseterm-server-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browseterm-server-cloud
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: browseterm-server-cloud
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9999"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: browseterm-server-cloud
        image: ${REPO_NAME}/browseterm-server-cloud:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9999
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: REDIS_HOST
          value: "${REDIS_HOST}"
        - name: REDIS_PORT
          value: "${REDIS_PORT}"
        - name: REDIS_PASSWORD
          value: "${REDIS_PASSWORD}"
        - name: REDIS_USERNAME
          value: "${REDIS_USERNAME}"
        - name: REDIS_DB
          value: "${REDIS_DB}"
        # HOST/PORT are non-secret config (kept as literals). USER/PASSWORD/DB come from the
        # same browseterm-db-credentials Secret the existing browseterm-server Deployment uses,
        # so the password is never templated into this manifest.
        - name: POSTGRES_HOST
          value: "${POSTGRES_HOST}"
        - name: POSTGRES_PORT
          value: "${POSTGRES_PORT}"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: browseterm-db-credentials
              key: DB_USERNAME
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: browseterm-db-credentials
              key: DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: browseterm-db-credentials
              key: DB_DATABASE
        # Shared secret gating the internal-only auth/container/subscription routes Local calls
        # server-to-server (src/cloud/auth_handlers.py, container_handlers.py,
        # subscription_handlers.py) - must match Local's own CLOUD_INTERNAL_API_TOKEN. Interim,
        # see those modules' docstrings for what replaces it (P07).
        - name: CLOUD_INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: browseterm-internal-api-token
              key: CLOUD_INTERNAL_API_TOKEN
        # P07 - Cloud is the sole OAuth authority (p07.md). AUTH_REDIRECT_BASE_URI/
        # BROWSETERM_LOCAL_CALLBACK_URL/BROWSETERM_ALLOWED_HOSTS are non-secret config (kept as
        # literals); GOOGLE/GITHUB client id+secret come from a dedicated Secret, same pattern as
        # browseterm-db-credentials - never templated as a literal value into this manifest.
        - name: AUTH_REDIRECT_BASE_URI
          value: "${AUTH_REDIRECT_BASE_URI}"
        - name: BROWSETERM_LOCAL_CALLBACK_URL
          value: "${BROWSETERM_LOCAL_CALLBACK_URL}"
        - name: BROWSETERM_ALLOWED_HOSTS
          value: "${BROWSETERM_ALLOWED_HOSTS}"
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: browseterm-oauth-credentials
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: browseterm-oauth-credentials
              key: GOOGLE_CLIENT_SECRET
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: browseterm-oauth-credentials
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: browseterm-oauth-credentials
              key: GITHUB_CLIENT_SECRET
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9999
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9999
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: browseterm-server-cloud-service
  namespace: ${NAMESPACE}
  labels:
    app: browseterm-server-cloud
spec:
  type: ClusterIP
  selector:
    app: browseterm-server-cloud
  ports:
  - name: http
    protocol: TCP
    port: 9999
    targetPort: http
---
# P07 - Cloud must be reachable by the browser directly now (OAuth start/callback are top-level
# browser redirects, and Local/Desktop call the handoff/device-bootstrap APIs over HTTP) - before
# P07 this Service was ClusterIP-only with no external access, since nothing outside the cluster
# needed to reach Cloud yet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: browseterm-server-cloud-ingress
  namespace: ${NAMESPACE}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: ${CLOUD_INGRESS_HOST}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: browseterm-server-cloud-service
            port:
              number: 9999
